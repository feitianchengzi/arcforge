name: Manual Governed Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tf/vx.x.x-bN, beta/vx.x.x-rcN, or appstore/vx.x.x tag
        required: true
        type: string
      target:
        description: Artifact set to build
        required: true
        default: provider
        type: choice
        options:
          - provider
          - cli
          - macos-arm64
          - macos-x64
          - windows-x64
          - linux-x64
          - desktop-all
          - all
      publish:
        description: Keep Actions artifacts only or attach them to a draft release for the existing tag
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - draft-release
      allow_main_beta:
        description: Explicitly accept a beta tag on main when its release line does not exist
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arcforge-package-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release intent
    runs-on: ubuntu-latest
    outputs:
      product_version: ${{ steps.contract.outputs.product_version }}
      package_version: ${{ steps.contract.outputs.package_version }}
      channel: ${{ steps.contract.outputs.channel }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      commit: ${{ steps.contract.outputs.commit }}
      desktop_matrix: ${{ steps.selection.outputs.desktop_matrix }}
      build_desktop: ${{ steps.selection.outputs.build_desktop }}
      build_cli: ${{ steps.selection.outputs.build_cli }}
      build_provider: ${{ steps.selection.outputs.build_provider }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Fetch governed refs
        run: git fetch origin main 'refs/heads/release/*:refs/remotes/origin/release/*' 'refs/tags/*:refs/tags/*' --force

      - id: contract
        name: Validate tag, commit, version, and baseline
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_MAIN_BETA: ${{ inputs.allow_main_beta }}
        run: node scripts/validate-release-trigger.mjs --tag "$RELEASE_TAG" --allow-main-beta "$ALLOW_MAIN_BETA" --github-output "$GITHUB_OUTPUT"

      - id: selection
        name: Resolve operator-selected artifact set
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          build_provider=false
          build_cli=false
          matrix='[]'
          case "$TARGET" in
            provider) build_provider=true ;;
            cli) build_cli=true ;;
            macos-arm64) matrix='[{"name":"macOS Apple Silicon","os":"macos-15","script":"package:mac:arm64","artifact":"arcforge-macos-arm64"}]' ;;
            macos-x64) matrix='[{"name":"macOS Intel","os":"macos-15-intel","script":"package:mac:x64","artifact":"arcforge-macos-x64"}]' ;;
            windows-x64) matrix='[{"name":"Windows x64","os":"windows-latest","script":"package:win:x64","artifact":"arcforge-windows-x64"}]' ;;
            linux-x64) matrix='[{"name":"Linux x64","os":"ubuntu-latest","script":"package:linux:x64","artifact":"arcforge-linux-x64"}]' ;;
            desktop-all) matrix='[{"name":"macOS Intel","os":"macos-15-intel","script":"package:mac:x64","artifact":"arcforge-macos-x64"},{"name":"macOS Apple Silicon","os":"macos-15","script":"package:mac:arm64","artifact":"arcforge-macos-arm64"},{"name":"Windows x64","os":"windows-latest","script":"package:win:x64","artifact":"arcforge-windows-x64"},{"name":"Linux x64","os":"ubuntu-latest","script":"package:linux:x64","artifact":"arcforge-linux-x64"}]' ;;
            all)
              build_provider=true
              build_cli=true
              matrix='[{"name":"macOS Intel","os":"macos-15-intel","script":"package:mac:x64","artifact":"arcforge-macos-x64"},{"name":"macOS Apple Silicon","os":"macos-15","script":"package:mac:arm64","artifact":"arcforge-macos-arm64"},{"name":"Windows x64","os":"windows-latest","script":"package:win:x64","artifact":"arcforge-windows-x64"},{"name":"Linux x64","os":"ubuntu-latest","script":"package:linux:x64","artifact":"arcforge-linux-x64"}]'
              ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          echo "build_provider=$build_provider" >> "$GITHUB_OUTPUT"
          echo "build_cli=$build_cli" >> "$GITHUB_OUTPUT"
          echo "desktop_matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '[]' ]]; then echo 'build_desktop=false' >> "$GITHUB_OUTPUT"; else echo 'build_desktop=true' >> "$GITHUB_OUTPUT"; fi

  provider:
    name: Embedded provider
    needs: validate
    if: needs.validate.outputs.build_provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: node --test --test-name-pattern='embedded provider' tests/provider.test.mjs
      - run: npm run build:cli
      - name: Build provider archive and provenance
        run: >-
          node scripts/build-provider-package.mjs
          --version '${{ needs.validate.outputs.package_version }}'
          --commit '${{ needs.validate.outputs.commit }}'
          --tag '${{ inputs.release_tag }}'

      - uses: actions/upload-artifact@v4
        with:
          name: arcforge-provider-${{ needs.validate.outputs.package_version }}
          path: release/provider-release/*
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    needs: validate
    if: needs.validate.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run version:set -- '${{ needs.validate.outputs.product_version }}'
      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.validate.outputs.channel }}-${{ needs.validate.outputs.product_version }}-${{ github.run_id }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  cli:
    name: CLI package
    needs: validate
    if: needs.validate.outputs.build_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:cli
      - run: node scripts/build-cli-package.mjs --version '${{ needs.validate.outputs.package_version }}' --repo '${{ github.repository }}'

      - name: Archive CLI assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/cli-release
          for target in darwin-x64 darwin-arm64 linux-x64; do
            tar -C release/cli-work -czf "release/cli-release/arcforge-cli-${target}.tar.gz" arcforge-cli
          done
          (cd release/cli-work && zip -qr ../cli-release/arcforge-cli-win-x64.zip arcforge-cli)
          cp release/cli-assets/install.sh release/cli-assets/install.ps1 release/cli-release/
          (cd release/cli-release && sha256sum * > checksums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: arcforge-cli-${{ needs.validate.outputs.package_version }}
          path: release/cli-release/*
          if-no-files-found: error

  publish:
    name: Attach assets to draft release
    needs: [validate, provider, desktop, cli]
    if: >-
      always() &&
      inputs.publish == 'draft-release' &&
      needs.validate.result == 'success' &&
      (needs.provider.result == 'success' || needs.provider.result == 'skipped') &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (needs.cli.result == 'success' || needs.cli.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update draft release without moving the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.product_version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          if [[ "${#files[@]}" -eq 0 ]]; then echo "No release assets found." >&2; exit 1; fi
          if gh release view "$TAG" --json isDraft --jq .isDraft >/tmp/is-draft 2>/dev/null; then
            if [[ "$(cat /tmp/is-draft)" != true ]]; then echo "Refusing to mutate an already published release: $TAG" >&2; exit 1; fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            prerelease=()
            if [[ "$CHANNEL" != appstore ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" --verify-tag --draft "${prerelease[@]}" --title "ArcForge $VERSION ($CHANNEL)" --generate-notes
          fi
