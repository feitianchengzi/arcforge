metadata:
  path: tech/_shared/models/UserSkillCatalog.yaml
  domain: profiles-sync
  entity_name: UserSkillCatalog
  storage: ~/.arcforge/catalog/index.json
  owner: core/skill-catalog
  version: 2
  created: 2026-07-30
  updated: 2026-08-14
type: object
required:
  - version
  - updatedAt
  - entries
properties:
  version:
    type: integer
    const: 2
  updatedAt:
    type: string
    format: date-time
  entries:
    type: array
    items:
      type: object
      required:
        - qualifiedName
        - skillName
        - status
        - activeSourceKey
        - installedPath
        - contentDigest
        - sourceClaims
        - appliedRecordIds
        - installedAt
      properties:
        qualifiedName:
          type: string
          description: Stable local catalog name equal to the canonical skillName; it never encodes sourceKey.
        skillName:
          type: string
          description: Canonical path-safe name and logical catalog identity, unique under normalized case-insensitive comparison.
        version:
          type: string
          nullable: true
          description: Active Semantic Version read from SKILL.md frontmatter; absent is allowed until differing same-name content requires comparison.
        status:
          type: string
          enum:
            - ready
            - conflict
        conflictReason:
          type: string
          nullable: true
          enum:
            - same-version-content-conflict
            - version-unknown-conflict
        activeSourceKey:
          type: string
          description: Provenance key for the active copy; it is not part of logical identity or the installed directory.
        aliases:
          type: array
          nullable: true
          items:
            type: string
        summary:
          type: string
          nullable: true
          description: Short source description exposed with minimal candidate metadata only after the on-demand entry is explicitly invoked, for Agent-owned semantic selection.
        installedPath:
          type: string
          description: Absolute directory equal to ~/.arcforge/catalog/<skillName>/.
        contentDigest:
          type: string
          description: Digest of the active copy; conflict status prevents resolver use even when an existing active digest remains recorded.
        sourceClaims:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - sourceKey
              - sourceRoot
              - skillPath
              - contentDigest
              - appliedRecordIds
              - observedAt
            properties:
              sourceKey:
                type: string
              sourceRoot:
                type: string
              sourceRemoteUrl:
                type: string
                nullable: true
              sourceCommit:
                type: string
                nullable: true
              skillPath:
                type: string
                description: Skill directory path relative to the source project root.
              version:
                type: string
                nullable: true
              contentDigest:
                type: string
              appliedRecordIds:
                type: array
                items:
                  type: string
              observedAt:
                type: string
                format: date-time
        appliedRecordIds:
          type: array
          items:
            type: string
          description: Local application relations that currently manage the entry.
        installedAt:
          type: string
          format: date-time
validation:
  candidate_projection:
    description: Catalog list returns only skillName, qualifiedName, version, status, and summary in stable skill-name order; it does not expose local source or installation paths and does not rank candidates.
  unique_entry:
    description: Normalized case-insensitive skillName and qualifiedName are unique; sourceKey may repeat only inside provenance claims and never creates another logical entry.
  version_resolution:
    description: Equal content merges provenance; differing content upgrades only when both versions are valid and unequal, blocks downgrade, and records conflict for equal or unknown versions.
  contained_path:
    description: installedPath realpath must equal the canonical ~/.arcforge/catalog/<skillName>/ path and must not resolve through an escaping symbolic link.
  digest_match:
    description: Resolver returns a ready entry only when the installed directory digest equals contentDigest; conflict entries fail closed.
  migration:
    description: Version 1 entries are grouped by normalized skillName; identical content merges, deterministically newer valid versions win, and unresolved differences become one conflict record; every later plan keeps reporting extant sourceKey directories until confirmed cleanup.
  managed_removal:
    description: An entry can be removed only when no appliedRecordIds remain and cleanup was explicitly confirmed.
  atomic_write:
    description: Skill directories and index updates use sibling temporary paths and atomic rename; failure preserves the previous valid catalog.
