metadata:
  path: tech/_shared/models/PublishPlan.yaml
  domain: sharing-ipc
  entity_name: PublishPlan
  storage: in_memory
  owner: core/publish
  version: 3
  created: 2026-05-21
  updated: 2026-08-01
type: object
required:
  - root
  - repositoryName
  - visibility
  - files
  - detectedIntegrations
  - assessmentStatus
properties:
  root:
    type: string
  repositoryName:
    type: string
    description: Basename of workspace root.
  visibility:
    type: string
    enum:
      - private
      - public
  files:
    type: array
    items:
      type: string
    description: Workspace-relative files under the configured sourceDir.
  installReference:
    type: string
    nullable: true
    description: Explicit team repository install reference when configured; missing values remain unconfigured.
  detectedIntegrations:
    type: array
    items:
      type: string
    description: Delivery integrations detected from repository facts; no fixed installer is assumed.
  assessmentStatus:
    type: string
    enum:
      - not-supplied
      - supplied
  readinessAssessment:
    type: object
    nullable: true
    description: Optional Agent-produced assessment passed by the caller and preserved without semantic inference.
    required:
      - summary
      - evidence
      - unknowns
      - installCommandCandidates
      - checklist
    properties:
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
      unknowns:
        type: array
        items:
          type: string
      installCommandCandidates:
        type: array
        items:
          type: string
      checklist:
        type: array
        items:
          type: string
  sourceManifest:
    type: object
    nullable: true
    description: Normalized Git-tracked SkillProjectManifest to publish with this selection; null when the source project has no manifest.
    properties:
      path:
        type: string
        const: arcforge.skill-project.json
      selectedSkillPaths:
        type: array
        items:
          type: string
      policyDigest:
        type: string
      diagnostics:
        type: array
        items:
          type: string
validation:
  install_reference:
    description: Uses config.teamRepo when present and otherwise remains absent; core does not invent an owner or installer command.
  readiness_boundary:
    description: Core emits repository facts and structurally validates an optional caller-supplied assessment without generating semantic release advice.
  manifest_selection:
    description: When present, the published manifest retains the source defaultMode and only per-skill entries whose paths are included in files; local profiles, targets, and applied history are never serialized.
