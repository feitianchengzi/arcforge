metadata:
  path: tech/_shared/models/PublishPlan.yaml
  domain: sharing-ipc
  entity_name: PublishPlan
  storage: in_memory
  owner: core/publish
  version: 2
  created: 2026-05-21
  updated: 2026-07-30
type: object
required:
  - root
  - repositoryName
  - visibility
  - files
  - installCommands
  - checklist
properties:
  root:
    type: string
  repositoryName:
    type: string
    description: Basename of workspace root.
  visibility:
    type: string
    enum:
      - private
      - public
  files:
    type: array
    items:
      type: string
    description: Workspace-relative files under the configured sourceDir.
  installCommands:
    type: array
    items:
      type: string
    description: Commands for skillshare and npx skills installation.
  checklist:
    type: array
    items:
      type: string
  sourceManifest:
    type: object
    nullable: true
    description: Normalized Git-tracked SkillProjectManifest to publish with this selection; null when the source project has no manifest.
    properties:
      path:
        type: string
        const: arcforge.skill-project.json
      selectedSkillPaths:
        type: array
        items:
          type: string
      policyDigest:
        type: string
      diagnostics:
        type: array
        items:
          type: string
validation:
  install_reference:
    description: Uses config.teamRepo when present, otherwise github.com/<owner>/<repositoryName>.
  visibility_check:
    description: Public visibility includes private information removal guidance; private visibility includes permissions guidance.
  manifest_selection:
    description: When present, the published manifest retains the source defaultMode and only per-skill entries whose paths are included in files; local profiles, targets, and applied history are never serialized.
