metadata:
  path: tech/_shared/contracts/apply-drift.yaml
  domain: profiles-sync
  owner: electron/main
  version: 4
  created: 2026-06-01
  updated: 2026-07-30
endpoint:
  transport: electron-ipc
  channel: apply:drift
  method_name: driftFromSource
  summary: Compare source content and the current resolved availability plan against recorded user, project, and catalog destinations.
  auth_required: false
request:
  args:
    - name: root
      type: string
      required: true
    - name: from
      type: string
      required: false
    - name: profile
      type: string
      required: true
    - name: targetDir
      type: string
      required: false
      description: Legacy direct target directory.
    - name: agentTargetIds
      type: string[]
      required: false
    - name: projectTargetDirs
      type: string[]
      required: false
    - name: availabilityOverrides
      type: object[]
      required: false
    - name: skills
      type: string[]
      required: false
responses:
  success:
    schema:
      $ref: "../models/DriftReport.yaml"
  errors:
    - code: PROFILE_NOT_FOUND
      message: Profile not found.
    - code: SOURCE_NOT_FOUND
      message: Source Skill project cannot be resolved.
    - code: FILE_HASH_FAILED
      message: A compared file cannot be read for hashing.
    - code: SOURCE_MANIFEST_INVALID
      message: The source recommendation manifest has blocking diagnostics.
    - code: TARGET_CONTEXT_INVALID
      message: The target context cannot resolve every effective mode.
business_logic:
  flow:
    - Resolve from to a local Skill project root when provided; otherwise use the current workspace.
    - Preserve file-only comparison when targetDir is the sole target input.
    - Otherwise recompute the current availability plan using the same resolver as apply-plan and apply-run.
    - Applied relationships reuse their persisted agent, project, override, and home context; local sourceRoot values do not require a remote cache directory.
    - Select profile skills, optional explicit skills, and resolved destinations.
    - Build SHA-256 directory signatures.
    - Scan direct target-root entries outside the current source selection and return them as targetExtras.
    - Compare recorded effective modes and destinations with the current plan and return policyDrift separately from content status.
    - Compare the fixed on-demand loader at every planned user-agent loader target and expose confirmation-gated cleanup candidates through the fresh availabilityPlan.
    - Return missing, changed, extra, and same content statuses without deleting or relocating any target.
