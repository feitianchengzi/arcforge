metadata:
  path: tech/_shared/contracts/apply-plan.yaml
  domain: profiles-sync
  owner: electron/main
  version: 4
  created: 2026-07-30
  updated: 2026-08-14
endpoint:
  transport: electron-ipc-and-cli
  channel: apply:plan
  method_name: createSkillAvailabilityPlan
  summary: Resolve source recommendations, consumer overrides, flat catalog targets, version decisions, loader targets, policy diagnostics, and cleanup without writing files.
  auth_required: false
request:
  args:
    - name: root
      type: string
      required: true
    - name: from
      type: string
      required: false
    - name: profile
      type: string
      required: true
    - name: skills
      type: string[]
      required: false
    - name: agentTargetIds
      type: string[]
      required: true
    - name: projectTargetDirs
      type: string[]
      required: false
    - name: availabilityOverrides
      type: object[]
      required: false
      item_schema:
        required:
          - skill
          - mode
        properties:
          skill:
            type: string
          mode:
            type: string
            enum:
              - user-ambient
              - project-ambient
              - user-on-demand
    - name: projectAssessments
      type: object[]
      required: false
      description: Agent or user applicability decisions supplied by the caller for project-ambient skills; core validates but never generates them.
    - name: catalogSourceSelections
      type: object[]
      required: false
      item_schema:
        $ref: "../models/CatalogSourceSelection.yaml"
responses:
  success:
    schema:
      $ref: "../models/SkillAvailabilityPlan.yaml"
  errors:
    - code: PROFILE_NOT_FOUND
      message: Profile not found.
    - code: SOURCE_NOT_FOUND
      message: Source Skill project cannot be resolved.
    - code: SOURCE_MANIFEST_INVALID
      message: The Git-tracked Skill project manifest is malformed or contains unsafe paths.
    - code: TARGET_CONTEXT_INVALID
      message: Agent or project targets required by an effective mode are missing.
    - code: UNCLASSIFIED_SKILL
      message: No source, profile, or invocation policy selected an availability mode.
    - code: PROJECT_ASSESSMENT_REQUIRED
      message: A project-ambient skill requires a suitable Agent assessment or explicit user override.
    - code: ON_DEMAND_LOADER_CONFLICT
      message: A fixed loader target exists but is neither content-identical nor proven to be managed by a saved ArcForge availability relationship.
    - code: CATALOG_VERSION_CONFLICT
      message: Differing same-name catalog content has equal, missing, or invalid version evidence and cannot be selected automatically.
    - code: CATALOG_SOURCE_SELECTION_STALE
      message: The selected incoming source or expected catalog digest changed before fresh planning.
business_logic:
  flow:
    - Resolve and scan the source Skill project without mutating the checkout.
    - Derive sourceKey from canonical Git identity or canonical local real path for provenance only.
    - Resolve invocation, profile, source-skill, and source-default policy in precedence order; keep missing values unclassified.
    - Validate caller-supplied project assessments against source condition IDs without interpreting condition text.
    - Map user-ambient to user agent roots, project-ambient to the agent/project cross product, and user-on-demand to ~/.arcforge/catalog/<skillName>/.
    - Compare each user-on-demand item with the one existing normalized-name catalog record; merge equal content, select a higher valid Semantic Version, block downgrade, and report an unresolved version conflict as a blocking diagnostic.
    - Accept a caller-explicit CatalogSourceSelection only when its skill, incoming sourceKey, incoming content digest, and expected current catalog digest match the fresh plan; emit source-selected instead of conflict or downgrade blocking.
    - Add user-level on-demand entry loader targets for every selected agent when at least one item is user-on-demand.
    - Inspect each loader target and classify it as missing, same, managed-update, or conflict; only a saved on-demand availability relation for the same agent and home proves ownership of differing content.
    - Return ON_DEMAND_LOADER_CONFLICT as a blocking diagnostic for unknown same-name targets.
    - Compare the plan with saved application relations and every extant sourceKey directory represented by catalog source claims, then return confirmation-gated cleanup items even after the index is already v2.
    - Return diagnostics and make no filesystem changes.
