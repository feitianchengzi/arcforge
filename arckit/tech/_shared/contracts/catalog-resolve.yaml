metadata:
  path: tech/_shared/contracts/catalog-resolve.yaml
  domain: profiles-sync
  owner: core/skill-catalog
  version: 2
  created: 2026-07-30
  updated: 2026-08-14
endpoints:
  transport: core-and-cli
  commands:
    - arcforge catalog list
    - arcforge catalog resolve
  method_names:
    - listCatalogSkills
    - resolveCatalogSkill
  summary: Expose minimal local candidates for Agent semantic selection, then deterministically resolve one selected user-level on-demand skill.
  auth_required: false
requests:
  list:
    args: []
  resolve:
    args:
      - name: query
        type: string
        required: true
      - name: mode
        type: string
        required: false
        enum:
          - exact
          - search
        default: exact
responses:
  list:
    schema:
      type: object
      required:
        - status
        - candidates
      properties:
        status:
          type: string
          enum:
            - available
            - empty
        candidates:
          type: array
          description: Sorted minimal skillName, qualifiedName, sourceKey, and summary metadata for Agent semantic selection.
          items:
            type: object
  success:
    schema:
      type: object
      required:
        - status
        - candidates
      properties:
        status:
          type: string
          enum:
            - resolved
            - ambiguous
            - not-found
        resolved:
          type: object
          nullable: true
          description: Validated UserSkillCatalog entry returned only for resolved status.
        candidates:
          type: array
          description: Minimal name, qualifiedName, sourceKey, and summary fields; full SKILL.md content is never returned for candidate listing.
          items:
            type: object
  errors:
    - code: CATALOG_INVALID
      message: The catalog index cannot be parsed or validated.
    - code: CATALOG_PATH_ESCAPE
      message: The selected installed path escapes its declared source catalog root.
    - code: CATALOG_CONTENT_DRIFT
      message: The selected installed skill digest differs from the catalog entry.
business_logic:
  flow:
    - Read only ~/.arcforge/catalog/index.json and never scan arbitrary filesystem roots.
    - List validates the catalog index and returns sorted minimal metadata without sourceRoot, installedPath, contentDigest, or SKILL.md content.
    - The explicitly invoked Agent compares the complete user intent with candidate metadata; core does not generate keywords, scores, rankings, or semantic conclusions.
    - An arbitrary task prompt is never passed to resolve as a literal query; after semantic selection the Agent resolves the selected qualifiedName in exact mode.
    - Exact mode matches qualifiedName, skillName, or alias; ambiguous unqualified matches return candidates without choosing by directory order.
    - Search mode remains a deterministic normalized substring filter over name, alias, and summary fields and is not semantic selection.
    - Resolve installedPath realpath, enforce catalog-root containment, and verify contentDigest.
    - Return one validated entry or a non-resolved status; never execute the selected skill.
