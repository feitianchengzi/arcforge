interface:
  display_name: "ArcForge Skill First"
  short_description: "编排 Skill First：路由目标 skill、调用 creator、验证并交接治理。"
  default_prompt: >-
    使用 $arcforge-skill-first 编排目标 skill 的创建/维护、隔离验证、观察和治理交接，不直接完成业务任务。由 Agent 动态判断目标与辅助能力，不维护具体业务 skill 黑白名单；创建维护交给 $arcforge-skill-creator。验证时依次选择平台原生隔离 agent/sub-agent、已配置 runner/harness、人工桥接 fallback，并让所有通道绑定同一工作副本、使用去污染真实任务、返回统一事实报告。结果回来前保持等待状态；路径不匹配只算绑定失败。不要执行 apply/share/push/目标覆盖/远程写入/registry 写入。
