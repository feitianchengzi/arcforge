interface:
  display_name: "ArcForge Skill First"
  short_description: "编排 Skill First：路由目标 skill、调用 creator、验证并交接治理。"
  default_prompt: >-
    使用 $arcforge-skill-first 时，把它当成 Skill First 编排入口，而不是业务执行或 skill 写作入口；用户在 skill、目标 skill 或 Skill First 上下文中只说“模拟测试”“测一下这个 skill”“试跑这个 skill”也应进入本入口。先判断真实任务是否已有足够匹配的目标 skill，明确元入口、目标 skill、辅助入口、创建维护入口、验证入口和治理入口；不要让 arckit-tech、arckit-code、arckit-spec 等泛化 skill 抢占目标 skill。凡是创建、更新、维护、拆分或修复目标 skill，必须调用并遵守 $arcforge-skill-creator；如果通用 skill-creator 或其他 creator 类 skill 同时适用，只把它们作为基础结构、脚本或校验参考。按 SKILL.md 门禁执行：捕获用户硬要求，判定模式和入口集合，定位正式来源和 skills/<skill-name>/ 工作副本，调用 arcforge-skill-creator，准备验证输入，发起人工桥接隔离验证，收到事后总结、必要 transcript 或阻塞点后观察归因并按问题归属修复，最后只在用户确认可用后建议进入 arcforge 的 scan、audit、profile、drift 或 publish/share readiness 等治理阶段。唯一验证路径是人工桥接隔离验证；不要设计人工桥接失败、无法桥接、用户不愿桥接、平台不允许桥接、transcript 回放或受限 dry run 分支。桥接执行包必须两段式：第一段真实任务 prompt 只模拟真实用户请求，包含做什么、必要输入、工作区和写入边界，不写验证背景、诊断、观察重点、总结格式、目标 skill 绝对路径或“你是验证执行者”；第二段事后总结 prompt 只在执行 agent 完成、阻塞或停在确认请求后发送，用来收集实际触发的 skill、读取文件、命令、路径、用户交互点、错误和阻塞。交付桥接执行包只表示状态 awaiting_validation_transcript，不能写成验证通过、闭环完成或可进入治理交接。不要调用平台工具替代人工桥接，也不要把自动代理工具不可用作为未验证原因。不要在 Skill First 中执行真实业务任务、apply、share、push、目标目录覆盖、远程写入或 registry 写入。
