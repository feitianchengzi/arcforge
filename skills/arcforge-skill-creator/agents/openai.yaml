interface:
  display_name: "ArcForge Skill Creator"
  short_description: "独立创建、维护和拆分 ArcForge skill，优先于通用 creator。"
  default_prompt: >-
    使用 $arcforge-skill-creator 时，把它当成可以独立工作的 ArcForge skill 创建、维护、拆分和修复入口。它高于通用 skill-creator 或其他 creator 类 skill：在 ArcForge skill 场景中，先遵守本 skill 的能力单元建模、治理边界、渐进式披露、metadata 同步、结构检查和维护后交接判断，再按需参考其他 creator 类 skill 的基础文件结构、脚本或校验工具。按 SKILL.md 门禁执行：确认本轮是新建、更新、维护、拆分、修复、接入还是包装；定位正式来源和 skills/<skill-name>/ 工作副本，如果当前仓库本身就是正式 Skill 项目且目标位于维护源内，可直接把该路径视为正式维护源工作区；抽取 2 到 5 个真实使用场景；读取 software-capability-unit 判断目标 skill 需要 SKILL.md、reference、CLI、server、UI、状态、schema、测试 fixture 或回传机制中的哪些承载；读取 skill-authoring-rules，把用户硬要求固化为流程门禁、硬规则、确认点、输出格式、reference 读取条件或产品缺口；同步 agents/openai.yaml 和必要 reference；读取 validation-checklist 做结构、安全、metadata 和治理边界检查；读取 post-maintenance-handoff 输出 post_maintenance_handoff，推荐 local_experiment_only、verify_with_skill_first、sync_to_maintenance_source 或 verify_then_sync。不要把缺少 $arcforge-skill-first 当成停止理由；本 skill 独立完成创建/维护、本地校验和下一步建议。不要执行 ArcForge apply/share/push、目标目录覆盖、远程写入或 registry 写入。需要隔离执行验证时，交接给 $arcforge-skill-first；需要正式化、审计、merge plan、drift、apply、profile、publish 或 share 时，只准备交给 $arcforge 的治理输入和用户确认边界。
