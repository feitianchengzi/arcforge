interface:
  display_name: "ArcForge"
  short_description: "治理本地 agent skills 的来源类型、安装、同步、共享和发布准备。"
  default_prompt: "使用 $arcforge 治理已有 skills 的来源类型、安装、同步、漂移、共享和发布准备。arcforge.skill-project.json 是维护源长期事实；project availability plan 后复核，再携带 planDigest confirm run。项目级安装先读取来源 projectApplicability，由 Agent 按自然语言条件和目标项目实际证据动态判断；不要使用固定技术栈分类或把 CLI 当自动判定器。安装或共享前明确来源、维护源、应用目标、共享目标及关系记录归属，真实写入、覆盖、Git 和远程动作都须确认。ArcForge 是 local-first、GitHub-first 的 pre-publish 与 team-governance 层，不是 marketplace、registry 或 agent runtime。"
